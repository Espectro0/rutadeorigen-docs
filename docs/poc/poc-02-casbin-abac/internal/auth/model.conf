[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = (r.sub.Role == "admin") || (r.sub.Role == "producer" && r.sub.BusinessID == r.obj.BusinessID && !(r.act == "edit" && r.obj.Status == "published")) || (r.sub.Role == "consumer" && r.act == "read" && r.obj.Status == "published")