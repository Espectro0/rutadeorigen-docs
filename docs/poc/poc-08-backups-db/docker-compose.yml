services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - ./certs:/root/.minio/certs
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local https://minio:9000 minioadmin minioadmin123 --insecure; do sleep 1; done &&
      mc mb --insecure local/pgbackrest || true &&
      echo 'bucket pgbackrest listo'
      "

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    depends_on:
      - minio-init
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rutadeorigen_poc
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=poc-demo --config=/etc/pgbackrest/pgbackrest.conf archive-push %p
      - -c
      - max_wal_senders=3
    ports:
      - "5432:5432"

volumes:
  pg-data:
  minio-data:
